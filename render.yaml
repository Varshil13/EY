services:
  - type: web
    name: loan-recommendation-api
    env: python
    root: loan_recommendation
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os; import uvicorn; from app import app; uvicorn.run(app, host='0.0.0.0', port=int(os.environ.get('PORT', 8000)))"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: VITE_SUPABASE_URL
        fromService:
          type: envVarGroup
          name: supabase-config
          property: VITE_SUPABASE_URL
      - key: VITE_SUPABASE_ANON_KEY
        fromService:
          type: envVarGroup
          name: supabase-config
          property: VITE_SUPABASE_ANON_KEY
      - key: OPENAI_API_KEY
        fromService:
          type: envVarGroup
          name: api-keys
          property: OPENAI_API_KEY
      - key: FRONTEND_URL
        value: https://your-frontend-app.onrender.com